# Server-side reverse proxy for MorphPhish.
# Place at /etc/nginx/conf.d/morphphish.conf on the public server, then:
#   1) set DEVICE_VPN_IP below to the VPN address of the Docker host
#   2) sudo nginx -t && sudo systemctl reload nginx
#   3) sudo certbot --nginx -d morphphish.baysarb.com     # adds the TLS/443 block + redirect
#
# DNS: morphphish.baysarb.com must have an A record -> THIS server's public IP.
# The device running docker-compose is reached only over the VPN; it is never public.

# WebSocket upgrade plumbing for Mailpit's live stream. If another conf.d file
# already defines $connection_upgrade, delete this block to avoid a duplicate map.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name morphphish.baysarb.com;

    # Scenario generation / uploads are small; keep a modest cap.
    client_max_body_size 10m;

    location / {
        proxy_pass http://DEVICE_VPN_IP:3000;     # <-- VPN IP of the Docker host
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
