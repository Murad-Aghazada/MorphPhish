# Server-side reverse proxy for MorphPhish — an ADDITIVE name-based virtual host.
# It shares ports 80/443 with your existing sites and does not alter them.
#
# Place at /etc/nginx/conf.d/morphphish.conf on the public server. Steps and the
# safe (test-before-reload) procedure are in docs/deploy-vpn-proxy.md.
#
# DNS: morphphish.baysarb.com must have an A record -> THIS server's public IP.
# The device running docker-compose is reached only over the VPN; it is never public.

# WebSocket upgrade plumbing for Mailpit's live stream. The output variable is
# uniquely named ($mp_conn_upgrade) so this never collides with a $connection_upgrade
# map an existing site may already define — multiple maps are fine as long as each
# writes a different variable.
map $http_upgrade $mp_conn_upgrade { default upgrade; '' close; }

# ---- Phase 1: HTTP. Serves the app and lets certbot complete the ACME challenge.
#      After the cert exists (certbot certonly), replace the `location /` below with
#      the redirect line, and uncomment the HTTPS server at the bottom.
server {
    listen 80;
    listen [::]:80;
    server_name morphphish.baysarb.com;

    client_max_body_size 10m;

    # After enabling HTTPS, comment the proxy block and use this redirect instead:
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://DEVICE_VPN_IP:3000;     # <-- VPN IP of the Docker host
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $mp_conn_upgrade;
        proxy_read_timeout 300s;
    }
}

