# Tiny reverse proxy to run ON THE PUBLIC SERVER. Forwards an external port to the
# MorphPhish app on the VPN host. Traefik already owns 80/443 on this server, so this
# listens on 8080 by default (change PROXY_PORT if you like / if it's taken).
#
#   cd deploy/server-proxy && docker compose up -d
#   # reachable at  http://<server-public-ip>:8080   (and http://<domain>:8080 if DNS points there)
#   # remove with:  docker compose down
services:
  morphphish-proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
