# Reverse proxy that runs on the PUBLIC server and forwards to the MorphPhish app
# on the VPN host (10.13.2.3:3000). Lets outside users reach the device without
# exposing it directly. Independent of the k3s/Traefik stack.
map $http_upgrade $mp_conn_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    location / {
        proxy_pass http://10.13.2.3:3000;      # <-- VPN IP:port of the Docker host
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $mp_conn_upgrade;
        proxy_read_timeout 300s;
    }
}
