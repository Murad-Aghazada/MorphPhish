# EXAMPLE ONLY — do not commit real values. Prefer creating the Secret with the
# kubectl command in README.md so credentials never touch git. If you do apply a
# file, copy this to secret.yaml (gitignored), fill it in, and `kubectl apply -f`.
apiVersion: v1
kind: Secret
metadata:
  name: morphphish-secrets
  namespace: morphphish
type: Opaque
stringData:
  # Signs admin session tokens. Generate: python -c "import secrets;print(secrets.token_urlsafe(32))"
  APP_SECRET_KEY: "REPLACE_WITH_RANDOM_32B_SECRET"
  # Admin console sign-in. Must NOT be the defaults, or the backend refuses to boot in production.
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"
  # Google AI Studio (Gemini) API key.
  LLM_API_KEY: "REPLACE_WITH_GEMINI_API_KEY"
