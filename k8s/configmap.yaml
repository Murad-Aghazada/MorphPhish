apiVersion: v1
kind: ConfigMap
metadata:
  name: morphphish-config
  labels:
    app.kubernetes.io/part-of: morphphish
data:
  APP_ENV: "production"                 # enables secure cookies + HSTS; refuses default secrets
  DATABASE_URL: "sqlite:////data/morphphish.db"
  CAMPAIGN_PROVIDER: "mock"
  HR_PROVIDER: "mock"
  LLM_PROVIDER: "gemini"
  LLM_MODEL: "gemini-flash-lite-latest"
  GEMINI_BASE_URL: "https://generativelanguage.googleapis.com"
  LLM_MAX_TOKENS: "900"
  EMAIL_PROVIDER: "smtp"
  SMTP_HOST: "mailpit"                  # resolves to the mailpit Service in this namespace
  SMTP_PORT: "1025"
  SMTP_FROM: "simulation@demo.example.com"
  AUTHORIZED_EMAIL_DOMAINS: "demo.example.com,example.com"
  # --- public origin: must match the Ingress host exactly (edit if your domain differs) ---
  FRONTEND_URL: "https://morphphish.example.com"
  BACKEND_URL: "https://morphphish.example.com"
  CORS_ORIGINS: "https://morphphish.example.com"
  # Two proxy hops (ingress-nginx -> frontend nginx) make a precise client IP unreliable,
  # so we don't trust forwarded headers; the login lockout is coarse (global) but un-spoofable.
  TRUST_PROXY_HEADERS: "false"
  SEED_ON_START: "true"                 # demo personas + scenarios on first boot
  TOKEN_TTL_MINUTES: "480"
  LOGIN_MAX_ATTEMPTS: "5"
  LOGIN_LOCKOUT_MINUTES: "15"
  LOG_LEVEL: "INFO"
