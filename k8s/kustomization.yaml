apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything is placed in this namespace.
namespace: morphphish

resources:
  - namespace.yaml
  - configmap.yaml
  - backend.yaml
  - frontend.yaml
  - mailpit.yaml
  - ingress.yaml
# NOTE: the Secret (morphphish-secrets) and the private-registry pull Secret
# (regcred) are created out-of-band with kubectl so no credentials live in git.
# See k8s/README.md.

# Set your Docker Hub user and the tag you pushed. Only these two lines change
# per environment — the Deployments reference the short names below.
images:
  - name: morphphish-backend
    newName: docker.io/DOCKERHUB_USER/morphphish-backend
    newTag: "0.1.0"
  - name: morphphish-frontend
    newName: docker.io/DOCKERHUB_USER/morphphish-frontend
    newTag: "0.1.0"
