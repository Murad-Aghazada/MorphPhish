apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: morphphish
  labels: { app.kubernetes.io/part-of: morphphish }
  annotations:
    # cert-manager issues + renews the TLS cert for the host below.
    # Change to your ClusterIssuer name if it isn't "letsencrypt-prod".
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["morphphish.example.com"]
      secretName: morphphish-tls          # created automatically by cert-manager
  rules:
    - host: morphphish.example.com
      http:
        paths:
          # All traffic goes to the frontend; its nginx proxies /api and /mailpit
          # to the backend and mailpit Services internally.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
