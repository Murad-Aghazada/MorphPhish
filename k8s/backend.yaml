apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: { app.kubernetes.io/part-of: morphphish, app: backend }
spec:
  replicas: 1                      # SQLite is single-writer — keep one pod
  strategy: { type: Recreate }     # never run two pods against the same DB file
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend, app.kubernetes.io/part-of: morphphish }
    spec:
      containers:
        - name: backend
          image: morphphish-backend        # rewritten by kustomize (images:)
          envFrom:
            - configMapRef: { name: morphphish-config }
            - secretRef: { name: morphphish-secrets }
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /data              # SQLite lives here (ephemeral)
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: { app.kubernetes.io/part-of: morphphish }
spec:
  type: ClusterIP
  selector: { app: backend }
  ports:
    - name: http
      port: 8000
      targetPort: 8000
