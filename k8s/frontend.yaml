apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app.kubernetes.io/part-of: morphphish, app: frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend, app.kubernetes.io/part-of: morphphish }
    spec:
      containers:
        - name: frontend
          # IMPORTANT: build this image with --build-arg VITE_API_URL=/api/v1 so the
          # SPA calls the same origin (nginx proxies /api + /mailpit to the services).
          image: morphphish-frontend        # rewritten by kustomize (images:)
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: { app.kubernetes.io/part-of: morphphish }
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports:
    - name: http
      port: 80
      targetPort: 80
