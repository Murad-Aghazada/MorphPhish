services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riskintern_phishsim}
      POSTGRES_USER: ${POSTGRES_USER:-riskintern}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riskintern}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-riskintern} -d ${POSTGRES_DB:-riskintern_phishsim}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  # Real campaign engine (optional). Set CAMPAIGN_PROVIDER=gophish to use it.
  # Admin API/UI on 3333; phishing server on 8080. First boot prints an admin
  # password in the logs — log in, then copy the API key from Account Settings.
  # Configured via the image's env vars (SQLite, no TLS) for the local lab.
  gophish:
    image: gophish/gophish:latest
    user: root                       # so GoPhish can write the SQLite DB on the named volume
    ports: ["3333:3333", "8080:80"]
    environment:
      ADMIN_LISTEN_URL: "0.0.0.0:3333"
      ADMIN_USE_TLS: "false"
      PHISH_LISTEN_URL: "0.0.0.0:80"
      PHISH_USE_TLS: "false"
      DB_FILE_PATH: "/data/gophish.db"   # persist login + API key across restarts
      CONTACT_ADDRESS: "security-team@demo.example.com"
    volumes:
      - gophish_data:/data

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${BACKEND_URL:-http://localhost:8000}/api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports: ["3000:80"]

volumes:
  postgres_data:
  gophish_data:
