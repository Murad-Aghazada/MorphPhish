# Single-origin production serving: nginx serves the built SPA and reverse-proxies
# /api to the backend, so the browser only ever talks to this origin (no CORS) and
# security headers below cover the whole app. Terminate TLS at a proxy in front of
# this (or add a listen 443 ssl server) for HTTPS — HSTS is set by the backend in prod.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the delivered app.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    # SPA uses inline styles (React style props) and same-origin XHR only.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API + tracking pixel -> backend (full /api/... URI is preserved).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached hard; index.html must not (new deploys).
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; }
}
